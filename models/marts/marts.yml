# Example model description in a YAML file
models: 
  - name: mart_order_summary 
    description: "One row per order with line-item and revenue metrics."
    columns: 
      - name: total_effective_revenue 
        description: "Revenue after applying line-item discounts."
  - name: mart_customer_metrics 
    description: "One row per Customer  with orders and spend metrics."
    columns: 
      - name: total_revenue 
        description: "Total effective revenue generated by Customers across all orders."